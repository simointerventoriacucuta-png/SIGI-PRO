<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIGI Pro</title>
<style>
  html { background: transparent; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { background: linear-gradient(135deg, #1f5fa8 0%, #123c6e 100%); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; box-sizing: border-box; border-radius: 10px; }
  .fila { display: flex; align-items: center; gap: 22px; }
  img { width: 96px; height: 96px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
  h1 { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: .5px; }
  h1 span { font-weight: 300; color: #ffc83d; }
  .sub { margin: 4px 0 0; font-size: 15px; opacity: .9; }
  .carga { margin-top: 34px; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
  .carga i { display: block; width: 35%; height: 100%; background: #ffc83d; animation: ir 1.1s ease-in-out infinite; }
  @keyframes ir { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .pie { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; opacity: .75; }
</style>
</head>
<body>
  <div class="fila">
    <img src="logo.svg" alt="">
    <div>
      <h1>SIGI <span>Pro</span></h1>
      <p class="sub">Sistema Integral de Gestión de Interventoría</p>
    </div>
  </div>
  <div class="carga"><i></i></div>
  <div class="pie"><span id="v">Cargando proyectos…</span><span>Control · Actas · Cantidades · Vencimientos</span></div>
  <script>document.getElementById('v').textContent = 'Versión ' + (new URLSearchParams(location.search).get('v') || '') + ' · cargando proyectos…';</script>
</body>
</html>
