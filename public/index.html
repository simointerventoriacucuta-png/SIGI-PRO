<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGI Pro</title>
  <link rel="icon" href="icono.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="barra-titulo">
    <div class="marca"><img src="logo.svg" alt=""><b>SIGI</b><span>Pro</span></div>
    <div class="acceso-rapido">
      <button id="btn-actualizar" title="Actualizar (F5)">⟳</button>
      <button id="btn-inicio-rapido" title="Tablero">⌂</button>
      <button id="btn-captura" title="Capturar avance de obra con fotos">📷</button>
    </div>
    <div class="titulo" id="titulo-ventana">SIGI Pro</div>
    <button class="caja-buscar" id="btn-buscar" title="Buscar en el proyecto (Ctrl+K)"><span>⌕</span> Buscar <kbd>Ctrl+K</kbd></button>
    <span class="esp"></span>
    <button class="cab-btn" id="btn-asistente" title="Asistente de IA (Ctrl+J)">✦ Asistente</button>
    <button class="cab-btn" id="btn-campana" title="Avisos de los próximos 7 días">🔔<span id="campana-n" class="globo" hidden></span></button>
    <button class="cab-btn" id="btn-usuario" title="Cambiar de usuario">👤 <span id="usuario-nombre">Sin usuario</span></button>
    <button class="ayuda" id="btn-acerca" title="Acerca de SIGI Pro">?</button>
    <div id="panel-avisos" class="panel-avisos" hidden></div>
  </header>

  <nav class="cinta">
    <div class="pestanas-cinta" id="pestanas-cinta"></div>
    <div class="grupos-cinta" id="grupos-cinta"></div>
    <button class="plegar-cinta" id="plegar-cinta" title="Contraer o mostrar la cinta">⌃</button>
  </nav>
  <div class="barra-proyecto">
    <label class="selector" title="Proyecto activo"><select id="sel-proyecto"></select></label>
    <span class="separador">⋮</span><i class="fx">fx</i>
    <div class="ruta" id="ruta-doc"></div>
  </div>
  <div class="menu-archivo" id="menu-archivo" hidden></div>

  <main class="area">
    <aside class="explorador">
      <div class="panel-titulo">Explorador del proyecto</div>
      <div id="arbol" class="arbol"></div>
    </aside>

    <section class="documentos">
      <div class="pestanas-doc" id="pestanas-doc"></div>
      <div class="contenido-doc" id="contenido-doc"></div>
    </section>

    <aside class="lateral" id="lateral">
      <div class="lateral-pestanas">
        <button data-panel="pendientes" class="activo">Pendientes</button>
        <button data-panel="memoria">Memoria</button>
        <button data-panel="asistente">Asistente</button>
      </div>
      <div class="lateral-cuerpo" id="lateral-cuerpo"></div>
    </aside>
  </main>

  <footer class="barra-estado">
    <span id="estado-version">SIGI Pro</span>
    <span id="estado-proyecto"></span>
    <span id="estado-mensaje" class="mensaje"></span>
    <span id="estado-sync" class="sync local"></span>
    <span class="fecha" id="hoy"></span>
    <span class="zoom">Zoom <input type="range" id="zoom" min="80" max="130" value="100"></span>
  </footer>

  <dialog id="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>
  <script src="app.js"></script>
</body>
</html>
